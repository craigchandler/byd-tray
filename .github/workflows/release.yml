name: Prepare reviewed desktop release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing prerelease tag at the current main commit, matching the app version
        required: true
        type: string
      create_draft:
        description: Create a GitHub release draft after validation and environment approval
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  source:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the existing tag and source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os, re, subprocess, xml.etree.ElementTree as ET
          version = ET.parse('src/Byd.Tray/Byd.Tray.csproj').findtext('./PropertyGroup/Version')
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+', tag), 'Use a prerelease tag'
          assert tag == 'v' + version, 'Tag must match the app version'
          actual = subprocess.check_output(['git', 'rev-parse', '--verify', 'refs/tags/' + tag + '^{commit}'], text=True).strip()
          assert actual == os.environ['GITHUB_SHA'], 'Tag must match current main'
          PY
  build:
    needs: source
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  draft:
    needs: build
    if: inputs.create_draft
    environment: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: artifacts/downloaded
      - name: Verify downloaded archives and create a draft only
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import hashlib, importlib.util, os, pathlib, subprocess
          spec = importlib.util.spec_from_file_location('release_check', 'tools/verify-release.py')
          checker = importlib.util.module_from_spec(spec); spec.loader.exec_module(checker)
          folder = pathlib.Path('artifacts/downloaded')
          files = sorted([*folder.glob('*.zip'), *folder.glob('*.tar.gz')])
          assert len(files) == 2, 'Expected Windows x64 and Linux x64 archives'
          runtimes = set()
          for file in files:
              metadata = checker.verify(file)
              assert metadata['sourceRevision'] == os.environ['GITHUB_SHA']
              assert 'v' + metadata['version'] == os.environ['RELEASE_TAG']
              runtimes.add(metadata['runtime'])
          assert runtimes == {'win-x64', 'linux-x64'}
          checksums = folder / 'SHA256SUMS'
          checksums.write_text(''.join(hashlib.sha256(f.read_bytes()).hexdigest() + '  ' + f.name + '\n' for f in files))
          subprocess.run(['gh', 'release', 'create', os.environ['RELEASE_TAG'], '--repo', os.environ['GITHUB_REPOSITORY'],
              '--verify-tag', '--target', os.environ['GITHUB_SHA'], '--draft', '--prerelease', '--latest=false',
              '--title', 'BYD Tray ' + os.environ['RELEASE_TAG'], '--notes-file', 'docs/release-notes.md',
              *map(str, files), str(checksums)], check=True)
          PY
